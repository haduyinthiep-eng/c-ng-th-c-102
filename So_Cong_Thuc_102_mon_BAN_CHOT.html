let recipes=validSaved?saved:base;
if(!validSaved)localStorage.setItem('soCongThucData_v5',JSON.stringify(base));
let section='Tất cả', editIndex=-1;
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveData(){localStorage.setItem('soCongThucData_v5',JSON.stringify(recipes))}
function sections(){return ['Tất cả',...Array.from(new Set(recipes.map(r=>r.section))).filter(Boolean)]}
function renderTabs(){$('#tabs').innerHTML=sections().map(x=>`<button class="tab ${x===section?'on':''}" data-s="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{section=b.dataset.s;render()})}
function render(){
 const q=$('#search').value.toLowerCase().trim();
 const arr=recipes.map((r,i)=>({r,i})).filter(x=>(section==='Tất cả'||x.r.section===section)&&(!q||(x.r.name+' '+x.r.section+' '+x.r.ingredients.join(' ')+' '+x.r.steps).toLowerCase().includes(q)));
 $('#count').textContent=arr.length+' / '+recipes.length+' công thức';
 if(!arr.length){$('#list').innerHTML='<div class="empty">Không tìm thấy công thức phù hợp.</div>';renderTabs();return}
 let last='';let out='';
 for(const x of arr){const r=x.r;if(r.section!==last){out+=`<div class="sectionTitle">${esc(r.section)} </div>`;last=r.section}out+=`<article class="card"><h2>${esc(r.name)}</h2><div class="meta">${esc(r.section)} <span class="badge">${esc(r.method)}</span></div><div class="box"><h3>THÀNH PHẦN</h3><ul>${r.ingredients.map(v=>'<li>'+esc(v)+'</li>').join('')}</ul></div><div class="box"><h3>CÁCH LÀM</h3><p>${esc(r.steps)}</p></div><div class="box"><h3>LOẠI LY / DỤNG CỤ</h3><p>${esc(r.glass)}</p></div><div class="box"><h3>TRANG TRÍ</h3><p>${esc(r.garnish)}</p></div><div class="actions"><button onclick="editRecipe(${x.i})">✏️ Sửa / bổ sung</button><button class="alt" onclick="copyRecipe(${x.i})">📋 Sao chép</button></div></article>`}
 $('#list').innerHTML=out;renderTabs();}
function editRecipe(i){editIndex=i;const r=recipes[i];$('#formTitle').textContent='Sửa công thức';fillForm(r);$('#del').style.display='block';$('#edit').style.display='block'}
function fillForm(r){$('#fName').value=r.name;$('#fIng').value=r.ingredients.join('\n');$('#fSteps').value=r.steps;$('#fGlass').value=r.glass;$('#fMethod').value=r.method;$('#fGarnish').value=r.garnish;$('#fSection').innerHTML=sections().filter(x=>x!=='Tất cả').map(x=>`<option>${esc(x)}</option>`).join('');$('#fSection').value=r.section}
$('#save').onclick=()=>{const r={name:$('#fName').value.trim(),section:$('#fSection').value,ingredients:$('#fIng').value.split('\n').map(x=>x.trim()).filter(Boolean),steps:$('#fSteps').value.trim(),glass:$('#fGlass').value.trim()||'—',method:$('#fMethod').value.trim()||'Theo công thức',garnish:$('#fGarnish').value.trim()||'—'};if(!r.name)return alert('Nhập tên món');if(!r.ingredients.length)return alert('Nhập ít nhất 1 thành phần');if(!r.steps)return alert('Nhập cách làm');recipes[editIndex]={...recipes[editIndex],...r};saveData();$('#edit').style.display='none';render()};
$('#del').onclick=()=>{if(confirm('Xóa công thức này?')){recipes.splice(editIndex,1);saveData();$('#edit').style.display='none';render()}};
$('#cancel').onclick=()=>$('#edit').style.display='none';
$('#add').onclick=()=>{editIndex=recipes.length;recipes.push({name:'MÓN MỚI',section:sections().find(x=>x!=='Tất cả')||'Đồ uống',ingredients:[''],steps:'',glass:'—',method:'Theo công thức',garnish:'—'});fillForm(recipes[editIndex]);$('#formTitle').textContent='Thêm công thức';$('#del').style.display='block';$('#edit').style.display='block'};
function copyRecipe(i){const r={...recipes[i],name:recipes[i].name+' – BẢN SAO'};recipes.push(r);saveData();render();window.scrollTo(0,document.body.scrollHeight)}
$('#search').oninput=render;$('#clearBtn').onclick=()=>{$('#search').value='';render();$('#search').focus()};
$('#menuBtn').onclick=()=>$('#menu').style.display='block';$('#closeMenu').onclick=()=>$('#menu').style.display='none';
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='so-cong-thuc-sao-luu.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x))throw 0;recipes=x;saveData();render();$('#menu').style.display='none';alert('Đã khôi phục '+recipes.length+' công thức.')}catch{alert('File sao lưu không hợp lệ.')}};rd.readAsText(f)};
render();
</script></body></html>
